<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 전세계 가성비 여행 가이드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; transition: background-color 0.3s; }
        .loading-shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .category-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .scale-in { animation: scaleIn 0.3s ease-out; }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

    <!-- 헤더 -->
    <header class="bg-white/90 backdrop-blur-md border-b sticky top-0 z-50 px-4 py-3 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                </div>
                <h1 class="font-bold text-lg tracking-tight">Travel AI <span class="text-[10px] bg-blue-100 text-blue-600 px-1 rounded ml-1">v2.0</span></h1>
            </div>
            <div class="flex gap-1">
                <button onclick="toggleSettings()" class="p-2 hover:bg-gray-100 rounded-xl transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
                <button onclick="refreshLocation()" class="p-2 hover:bg-gray-100 rounded-xl transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 pb-32">
        
        <!-- API 설정 패널 -->
        <div id="settings-panel" class="hidden bg-white border border-gray-200 rounded-3xl p-6 mb-6 shadow-xl space-y-6 animate-in fade-in slide-in-from-top-4 duration-300">
            <div>
                <h2 class="font-bold flex items-center gap-2 text-gray-800 mb-2">💎 Gemini API</h2>
                <input type="password" id="gemini-key-input" placeholder="Gemini API 키 입력" 
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm mb-2">
                <button onclick="window.open('https://aistudio.google.com/app/apikey', '_blank')" class="text-xs text-blue-600 font-bold underline">키가 없으신가요? 발급받기</button>
            </div>

            <div>
                <h2 class="font-bold flex items-center gap-2 text-gray-800 mb-2">🗺️ Google Maps API</h2>
                <input type="password" id="google-key-input" placeholder="Google Maps API 키 입력" 
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm mb-2">
                <button onclick="window.open('https://console.cloud.google.com/google/maps-apis/credentials', '_blank')" class="text-xs text-blue-600 font-bold underline">키 발급/확인하러 가기 (Places API 활성화 필수)</button>
            </div>

            <button onclick="saveAllKeys()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl active:scale-95 transition-all shadow-lg">설정 저장 및 적용</button>
        </div>

        <!-- 위치 상태 정보 -->
        <div id="location-status" class="bg-white border border-gray-100 rounded-2xl p-4 mb-6 shadow-sm flex flex-col gap-2">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="status-dot" class="animate-pulse bg-amber-400 w-2.5 h-2.5 rounded-full"></div>
                    <p id="status-text" class="text-sm text-gray-700 font-semibold">위치를 확인하는 중입니다...</p>
                </div>
                <span id="secure-badge" class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-gray-100">CHECKING...</span>
            </div>
            <p id="error-hint" class="text-xs text-red-500 hidden leading-relaxed font-medium"></p>
        </div>

        <!-- 카테고리 선택 영역 -->
        <div class="mb-8">
            <h2 class="text-xs font-bold text-gray-400 mb-3 px-1 uppercase tracking-widest">추천 카테고리</h2>
            <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                <button onclick="selectCategory('전체', this)" class="category-btn active shrink-0 px-5 py-3 rounded-2xl border border-gray-200 bg-white text-sm font-bold transition-all shadow-sm">전체</button>
                <button onclick="selectCategory('음식점', this)" class="category-btn shrink-0 px-5 py-3 rounded-2xl border border-gray-200 bg-white text-sm font-bold transition-all shadow-sm">🍽️ 음식점</button>
                <button onclick="selectCategory('관광명소', this)" class="category-btn shrink-0 px-5 py-3 rounded-2xl border border-gray-200 bg-white text-sm font-bold transition-all shadow-sm">🏛️ 관광지</button>
                <button onclick="selectCategory('공원', this)" class="category-btn shrink-0 px-5 py-3 rounded-2xl border border-gray-200 bg-white text-sm font-bold transition-all shadow-sm">🌳 산책/공원</button>
                <button onclick="selectCategory('카페', this)" class="category-btn shrink-0 px-5 py-3 rounded-2xl border border-gray-200 bg-white text-sm font-bold transition-all shadow-sm">☕ 카페</button>
            </div>
        </div>

        <!-- 실행 버튼 -->
        <button id="main-btn" disabled 
                onclick="startProcess()"
                class="w-full bg-blue-600 text-white font-bold py-5 rounded-3xl shadow-xl shadow-blue-200 disabled:bg-gray-200 disabled:shadow-none transition-all active:scale-[0.98] mb-10 flex items-center justify-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            <span id="btn-label">주변 정보 분석 시작</span>
        </button>

        <!-- 결과 표시 영역 -->
        <div id="results-container" class="space-y-6">
            <div id="empty-state" class="text-center py-16">
                <div class="bg-gray-100 w-24 h-24 rounded-[2rem] flex items-center justify-center mx-auto mb-6 rotate-6 shadow-inner">
                    <span class="text-4xl">📍</span>
                </div>
                <p class="text-gray-500 font-bold text-lg leading-tight">준비 완료!<br><span class="text-sm font-medium text-gray-400 italic">API 키를 설정하고 위치 권한을 확인해 주세요.</span></p>
                <p id="key-check-warning" class="text-xs text-red-500 mt-4 hidden font-bold">⚠️ API 키 설정이 필요합니다 (우측 상단 ⚙️)</p>
            </div>
        </div>

        <!-- 스켈레톤 UI -->
        <div id="skeleton" class="hidden space-y-6">
            <div class="bg-white rounded-[2.5rem] p-6 border border-gray-100 space-y-4">
                <div class="loading-shimmer h-6 w-1/2 rounded-full"></div>
                <div class="loading-shimmer h-32 w-full rounded-3xl"></div>
                <div class="loading-shimmer h-12 w-full rounded-2xl"></div>
            </div>
        </div>

        <!-- AI 대화 인터페이스 -->
        <div id="ai-chat-area" class="mt-12 pt-8 border-t border-gray-200 hidden">
            <h2 class="text-xs font-bold text-gray-400 mb-4 px-1 uppercase tracking-widest">AI 여행 컨시어지</h2>
            <div class="bg-white rounded-3xl p-5 border border-gray-200 shadow-lg space-y-4">
                <textarea id="chat-input" rows="2" placeholder="예: '방금 추천해 준 곳들 중 가장 조용한 곳이 어디야?'" 
                          class="w-full p-4 bg-gray-50 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none font-medium"></textarea>
                <div class="flex gap-2">
                    <button onclick="chatAction('ask')" class="flex-1 bg-gray-900 text-white text-sm font-bold py-4 rounded-2xl active:scale-95 transition-all">질문하기</button>
                    <button onclick="chatAction('modify')" class="flex-1 bg-blue-50 text-blue-700 text-sm font-bold py-4 rounded-2xl border border-blue-100 active:scale-95 transition-all">수정 요청</button>
                </div>
            </div>
        </div>
    </main>

    <!-- 에러 모달 -->
    <div id="error-modal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-xs w-full text-center shadow-2xl scale-in">
            <div class="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-5">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
            </div>
            <h3 class="font-bold text-xl mb-3">알림</h3>
            <p id="error-message" class="text-gray-600 text-sm mb-8 leading-relaxed font-medium"></p>
            <button onclick="closeModal()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-bold transition-all active:scale-95 shadow-lg">알겠습니다</button>
        </div>
    </div>

    <!-- Google Maps JS SDK -->
    <div id="map-api-container"></div>

    <script>
        let userLocation = null;
        let currentCategory = "전체";
        let geminiKey = localStorage.getItem('gemini_key') || "";
        let googleKey = localStorage.getItem('google_key') || "";
        let lastPlacesData = [];

        window.onload = () => {
            initKeys();
            refreshLocation();
            if (googleKey) loadGoogleMaps();
        };

        function initKeys() {
            if (!geminiKey || !googleKey) {
                document.getElementById('settings-panel').classList.remove('hidden');
                document.getElementById('key-check-warning').classList.remove('hidden');
            } else {
                document.getElementById('gemini-key-input').value = geminiKey;
                document.getElementById('google-key-input').value = googleKey;
            }
            checkProtocol();
        }

        function checkProtocol() {
            const badge = document.getElementById('secure-badge');
            if (window.location.protocol === 'https:') {
                badge.innerText = 'HTTPS SECURE';
                badge.classList.add('text-green-600');
            } else {
                badge.innerText = 'HTTP INSECURE';
                badge.classList.add('text-red-600');
                showError("현재 접속 주소가 HTTPS가 아닙니다. 브라우저 정책상 위치 정보 수신이 제한될 수 있습니다.");
            }
        }

        function saveAllKeys() {
            geminiKey = document.getElementById('gemini-key-input').value.trim();
            googleKey = document.getElementById('google-key-input').value.trim();
            
            if (!geminiKey || !googleKey) {
                showError("두 API 키를 모두 입력해 주세요.");
                return;
            }

            localStorage.setItem('gemini_key', geminiKey);
            localStorage.setItem('google_key', googleKey);
            document.getElementById('key-check-warning').classList.add('hidden');
            toggleSettings();
            loadGoogleMaps();
            showError("API 설정이 저장되었습니다.");
        }

        function loadGoogleMaps() {
            const container = document.getElementById('map-api-container');
            container.innerHTML = '';
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${googleKey}&libraries=places`;
            script.async = true;
            script.defer = true;
            container.appendChild(script);
        }

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('hidden');
        }

        function selectCategory(name, btn) {
            currentCategory = name;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('btn-label').innerText = `${name} 정보 분석 시작`;
        }

        function refreshLocation() {
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            const errorHint = document.getElementById('error-hint');
            const btn = document.getElementById('main-btn');
            
            statusText.innerText = "GPS 신호를 찾는 중...";
            statusDot.className = "animate-pulse bg-amber-400 w-2.5 h-2.5 rounded-full";
            errorHint.classList.add('hidden');
            btn.disabled = true;

            const success = (pos) => {
                userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                statusText.innerText = "위치 수신 완료";
                statusDot.className = "bg-green-500 w-2.5 h-2.5 rounded-full";
                btn.disabled = false;
            };

            const fail = (err) => {
                statusText.innerText = "위치 확인 실패";
                statusDot.className = "bg-red-500 w-2.5 h-2.5 rounded-full";
                errorHint.classList.remove('hidden');
                errorHint.innerText = "GPS 권한을 허용했는지, 보안(HTTPS) 연결인지 확인해 주세요.";
            };

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(success, fail, { timeout: 10000 });
            } else {
                statusText.innerText = "GPS 미지원 브라우저";
            }
        }

        async function startProcess() {
            if (!userLocation || !googleKey || !geminiKey) return;

            const resultsContainer = document.getElementById('results-container');
            const skeleton = document.getElementById('skeleton');
            const emptyState = document.getElementById('empty-state');
            const btn = document.getElementById('main-btn');

            emptyState.classList.add('hidden');
            skeleton.classList.remove('hidden');
            resultsContainer.innerHTML = '';
            btn.disabled = true;

            try {
                // 1단계: Google Places API에서 실제 데이터 가져오기
                const places = await fetchNearbyPlaces();
                if (places.length === 0) throw new Error("주변에서 유효한 장소를 찾을 수 없습니다.");
                
                lastPlacesData = places;

                // 2단계: Gemini API로 분석 요청
                await getGeminiAnalysis(places);

            } catch (err) {
                showError(err.message);
                emptyState.classList.remove('hidden');
            } finally {
                skeleton.classList.add('hidden');
                btn.disabled = false;
            }
        }

        function fetchNearbyPlaces() {
            return new Promise((resolve, reject) => {
                if (typeof google === 'undefined' || !google.maps || !google.maps.places) {
                    return reject(new Error("Google Maps 라이브러리가 로드되지 않았습니다. API 키를 확인해 주세요."));
                }

                const mapDiv = document.createElement('div');
                const service = new google.maps.places.PlacesService(mapDiv);
                
                const typeMap = {
                    "음식점": "restaurant",
                    "관광명소": "tourist_attraction",
                    "공원": "park",
                    "카페": "cafe",
                    "전체": "establishment"
                };

                const request = {
                    location: new google.maps.LatLng(userLocation.lat, userLocation.lng),
                    radius: '1500',
                    type: typeMap[currentCategory] || 'establishment'
                };

                service.nearbySearch(request, (results, status) => {
                    if (status === google.maps.places.PlacesServiceStatus.OK) {
                        const processed = results.slice(0, 10).map(p => ({
                            name: p.name,
                            place_id: p.place_id,
                            rating: p.rating || "없음",
                            address: p.vicinity,
                            price_level: p.price_level || 0,
                            types: p.types
                        }));
                        resolve(processed);
                    } else {
                        reject(new Error("장소 데이터를 가져오지 못했습니다: " + status));
                    }
                });
            });
        }

        async function getGeminiAnalysis(places, customQuery = null) {
            const resultsContainer = document.getElementById('results-container');
            const chatArea = document.getElementById('ai-chat-area');
            
            const systemPrompt = `
                당신은 전세계를 여행하는 한국인 가성비 여행 전문가입니다. 
                사용자가 제공한 실제 장소 목록(JSON)을 보고, 가성비(Value for Money), 한국인 취향, 특징을 분석하여 추천 리스트를 만드세요.
                추천 근거에는 구글 평점과 가격대를 고려하세요.
                반드시 다음 JSON 형식으로만 답변하세요:
                {
                    "recommendations": [
                        {
                            "name": "장소명(입력된 이름과 동일해야 함)",
                            "place_id": "제공된 place_id",
                            "recommendation_reason": "왜 이곳이 가성비가 좋고 추천하는지 설명",
                            "cost_info": "현지 물가 기준 예상 비용 및 원화 가치",
                            "popular_menu": "한국인에게 인기 있는 메뉴 (음식점이 아니면 적절한 추천 활동)",
                            "walking_tip": "현재 위치 기준 도보 팁"
                        }
                    ]
                }
            `;

            const userPrompt = customQuery || `다음 장소 목록을 분석해서 가성비 좋은 순으로 추천해 주세요: ${JSON.stringify(places)}`;

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${geminiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userPrompt }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: { 
                                responseMimeType: "application/json",
                                responseSchema: {
                                    type: "OBJECT",
                                    properties: {
                                        recommendations: {
                                            type: "ARRAY",
                                            items: {
                                                type: "OBJECT",
                                                properties: {
                                                    name: { type: "STRING" },
                                                    place_id: { type: "STRING" },
                                                    recommendation_reason: { type: "STRING" },
                                                    cost_info: { type: "STRING" },
                                                    popular_menu: { type: "STRING" },
                                                    walking_tip: { type: "STRING" }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        })
                    }
                );

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const analysis = JSON.parse(data.candidates[0].content.parts[0].text);
                renderCards(analysis.recommendations, !!customQuery);
                chatArea.classList.remove('hidden');

            } catch (err) {
                showError("AI 분석 오류: " + err.message);
            }
        }

        function renderCards(list, isAppend) {
            const container = document.getElementById('results-container');
            if (!isAppend) container.innerHTML = '';

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-[2.5rem] p-7 border border-gray-100 shadow-sm hover:shadow-2xl transition-all duration-300 animate-in fade-in slide-in-from-bottom-5";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-[11px] font-extrabold text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase tracking-widest italic">Highly Recommended</span>
                        <span class="text-[10px] text-gray-400 font-bold bg-gray-50 px-2 py-1 rounded-md">🚶 ${item.walking_tip}</span>
                    </div>
                    <h3 class="text-2xl font-bold mb-3 text-gray-900 tracking-tight">${item.name}</h3>
                    <p class="text-gray-600 text-sm leading-relaxed mb-6 font-medium">"${item.recommendation_reason}"</p>
                    
                    <div class="space-y-3">
                        <div class="flex items-center gap-4 bg-gray-50 p-4 rounded-2xl border border-gray-100">
                            <span class="text-xs font-bold text-gray-400 shrink-0 w-16">💰 예상 비용</span>
                            <span class="text-sm text-gray-800 font-bold">${item.cost_info}</span>
                        </div>
                        <div class="flex items-center gap-4 bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
                            <span class="text-xs font-bold text-blue-400 shrink-0 w-16">⭐ 인기 정보</span>
                            <span class="text-sm text-blue-900 font-bold">${item.popular_menu}</span>
                        </div>
                    </div>

                    <button onclick="window.open('https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name)}&query_place_id=${item.place_id}')" 
                            class="w-full mt-8 bg-gray-900 text-white py-4 rounded-2xl text-sm font-bold active:scale-[0.96] transition-all shadow-xl shadow-gray-200 flex items-center justify-center gap-2">
                        <img src="https://www.google.com/images/branding/product/2x/maps_96dp.png" class="w-4 h-4" alt="maps">
                        구글 지도로 정확한 위치 확인
                    </button>
                `;
                container.appendChild(card);
            });
            
            if (isAppend) window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        async function chatAction(type) {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !lastPlacesData.length) return;

            const btn = document.getElementById('main-btn');
            btn.disabled = true;
            
            const prefix = type === 'ask' ? "이전 추천 장소들에 대해 궁금한 점이 있습니다: " : "추천 리스트를 다음 요청에 맞춰 다시 분석해 주세요: ";
            const query = `${prefix}${text}. 기반 데이터는 동일하게 사용하세요: ${JSON.stringify(lastPlacesData)}`;
            
            await getGeminiAnalysis(lastPlacesData, query);
            input.value = '';
            btn.disabled = false;
        }

        function showError(msg) {
            const modal = document.getElementById('error-modal');
            const message = document.getElementById('error-message');
            message.innerText = msg;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('error-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
