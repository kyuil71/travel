<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 전세계 가성비 여행 가이드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; transition: background-color 0.3s; }
        .loading-shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .category-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

    <!-- 헤더 -->
    <header class="bg-white/80 backdrop-blur-md border-b sticky top-0 z-50 px-4 py-3 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                </div>
                <h1 class="font-bold text-lg tracking-tight">Travel AI</h1>
            </div>
            <div class="flex gap-1">
                <button onclick="toggleSettings()" class="p-2 hover:bg-gray-100 rounded-xl transition-colors" title="설정">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
                <button onclick="refreshLocation()" class="p-2 hover:bg-gray-100 rounded-xl transition-colors" title="위치 갱신">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 pb-32">
        
        <!-- API 설정 패널 -->
        <div id="settings-panel" class="hidden bg-white border border-gray-200 rounded-2xl p-5 mb-6 shadow-sm">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold flex items-center gap-2 text-gray-800">🔑 API 설정</h2>
                <button onclick="toggleSettings()" class="text-gray-400">✕</button>
            </div>
            <p class="text-xs text-gray-500 mb-4">Gemini API 키를 입력해 주세요. (모델: gemini-flash-latest)</p>
            <div class="space-y-3">
                <input type="password" id="api-key-input" placeholder="AI Studio API 키 입력" 
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                <div class="flex gap-2">
                    <button onclick="saveApiKey()" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl text-sm active:scale-95 transition-all">저장</button>
                    <button onclick="window.open('https://aistudio.google.com/app/apikey', '_blank')" 
                            class="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl text-sm border border-gray-200">키 발급</button>
                </div>
            </div>
        </div>

        <!-- 위치 상태 정보 -->
        <div id="location-status" class="bg-white border border-gray-100 rounded-2xl p-4 mb-6 shadow-sm flex flex-col gap-2">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="status-dot" class="animate-pulse bg-amber-400 w-2.5 h-2.5 rounded-full"></div>
                    <p id="status-text" class="text-sm text-gray-700 font-semibold">위치를 확인하는 중입니다...</p>
                </div>
                <span id="protocol-badge" class="text-[10px] px-2 py-0.5 rounded-full font-bold"></span>
            </div>
            <p id="error-hint" class="text-xs text-red-500 hidden leading-relaxed font-medium"></p>
        </div>

        <!-- 카테고리 선택 영역 -->
        <div class="mb-8">
            <h2 class="text-sm font-bold text-gray-400 mb-3 px-1 uppercase tracking-wider">추천 카테고리</h2>
            <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                <button onclick="selectCategory('전체', this)" class="category-btn active shrink-0 px-5 py-2.5 rounded-xl border border-gray-200 bg-white text-sm font-bold transition-all shadow-sm">전체</button>
                <button onclick="selectCategory('음식점', this)" class="category-btn shrink-0 px-5 py-2.5 rounded-xl border border-gray-200 bg-white text-sm font-bold transition-all shadow-sm">🍽️ 음식점</button>
                <button onclick="selectCategory('관광지', this)" class="category-btn shrink-0 px-5 py-2.5 rounded-xl border border-gray-200 bg-white text-sm font-bold transition-all shadow-sm">🏛️ 관광지</button>
                <button onclick="selectCategory('산책', this)" class="category-btn shrink-0 px-5 py-2.5 rounded-xl border border-gray-200 bg-white text-sm font-bold transition-all shadow-sm">🌳 산책</button>
                <button onclick="selectCategory('카페', this)" class="category-btn shrink-0 px-5 py-2.5 rounded-xl border border-gray-200 bg-white text-sm font-bold transition-all shadow-sm">☕ 카페</button>
            </div>
        </div>

        <!-- 실행 버튼 -->
        <button id="get-recommendations-btn" disabled 
                onclick="getAIRecommendations()"
                class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-200 disabled:bg-gray-200 disabled:shadow-none transition-all active:scale-[0.98] mb-10 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
            <span id="btn-label">주변 가성비 명소 추천받기</span>
        </button>

        <!-- 결과 표시 영역 -->
        <div id="results-container" class="space-y-6">
            <div id="empty-state" class="text-center py-16">
                <div class="bg-gray-100 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6 rotate-3">
                    <span class="text-3xl">🌍</span>
                </div>
                <p class="text-gray-500 font-bold text-lg leading-tight">준비가 되었습니다!<br><span class="text-sm font-medium text-gray-400">위치 확인 후 버튼을 눌러주세요.</span></p>
                <p id="api-warning" class="text-xs text-red-500 mt-4 hidden font-bold">⚠️ API 키를 먼저 입력해 주세요.</p>
            </div>
        </div>

        <!-- 로딩 스켈레톤 -->
        <div id="skeleton" class="hidden space-y-6">
            <div class="bg-white rounded-3xl p-5 border border-gray-100 space-y-4">
                <div class="loading-shimmer h-6 w-3/4 rounded-lg"></div>
                <div class="loading-shimmer h-24 w-full rounded-2xl"></div>
                <div class="loading-shimmer h-12 w-full rounded-xl"></div>
            </div>
        </div>

        <!-- AI 대화 및 수정 영역 -->
        <div id="ai-interact-container" class="mt-12 pt-8 border-t border-gray-200 hidden">
            <h2 class="text-sm font-bold text-gray-400 mb-4 px-1 uppercase tracking-wider">AI 여행 컨시어지</h2>
            <div class="bg-white rounded-2xl p-4 border border-gray-200 shadow-sm space-y-3">
                <textarea id="ai-input" rows="2" placeholder="예: '조금 더 조용한 곳으로 추천해줘' 또는 '가까운 화장실 위치 알려줘'" 
                          class="w-full p-3 bg-gray-50 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
                <div class="flex gap-2">
                    <button onclick="aiAction('question')" class="flex-1 bg-gray-900 text-white text-xs font-bold py-3 rounded-xl active:scale-95 transition-all flex items-center justify-center gap-1">
                        💬 질문하기
                    </button>
                    <button onclick="aiAction('edit')" class="flex-1 bg-blue-50 text-blue-700 text-xs font-bold py-3 rounded-xl border border-blue-100 active:scale-95 transition-all flex items-center justify-center gap-1">
                        ✏️ 수정 요청
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 모달 알림창 -->
    <div id="error-modal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-7 max-w-xs w-full text-center shadow-2xl scale-in">
            <div class="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
            </div>
            <h3 class="font-bold text-lg mb-2">알림</h3>
            <p id="error-message" class="text-gray-600 text-sm mb-6 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full bg-gray-900 text-white py-3.5 rounded-2xl font-bold transition-all active:scale-95 shadow-lg">확인했습니다</button>
        </div>
    </div>

    <script>
        let userLocation = null;
        let currentCategory = "전체";
        let storedApiKey = localStorage.getItem('gemini_api_key') || "";
        let chatHistory = [];

        window.onload = () => {
            checkProtocol();
            if (!storedApiKey) {
                document.getElementById('settings-panel').classList.remove('hidden');
                document.getElementById('api-warning').classList.remove('hidden');
            } else {
                document.getElementById('api-key-input').value = storedApiKey;
            }
            refreshLocation();
        };

        function checkProtocol() {
            const badge = document.getElementById('protocol-badge');
            if (window.location.protocol === 'https:') {
                badge.innerText = 'SECURE (HTTPS)';
                badge.className = 'text-[10px] px-2 py-0.5 rounded-full font-bold bg-green-100 text-green-700';
            } else {
                badge.innerText = 'NOT SECURE (HTTP)';
                badge.className = 'text-[10px] px-2 py-0.5 rounded-full font-bold bg-red-100 text-red-700';
            }
        }

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('hidden');
        }

        function saveApiKey() {
            const input = document.getElementById('api-key-input');
            const key = input.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                storedApiKey = key;
                document.getElementById('api-warning').classList.add('hidden');
                toggleSettings();
                showError("API 키가 안전하게 저장되었습니다.");
            } else {
                showError("유효한 키를 입력해주세요.");
            }
        }

        function selectCategory(name, btn) {
            currentCategory = name;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('btn-label').innerText = `${name} 추천받기`;
        }

        function refreshLocation() {
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            const errorHint = document.getElementById('error-hint');
            const btn = document.getElementById('get-recommendations-btn');
            
            statusText.innerText = "GPS 신호를 수신 중...";
            statusDot.className = "animate-pulse bg-amber-400 w-2.5 h-2.5 rounded-full";
            errorHint.classList.add('hidden');
            btn.disabled = true;

            const geoOptions = { 
                enableHighAccuracy: true, 
                timeout: 10000, 
                maximumAge: 0 
            };

            const success = (pos) => {
                userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                statusText.innerText = "위치 정보 수신 완료";
                statusDot.className = "bg-green-500 w-2.5 h-2.5 rounded-full";
                btn.disabled = false;
            };

            const fail = (err) => {
                // 정확도 모드 실패 시 일반 모드로 재시도
                if (geoOptions.enableHighAccuracy) {
                    geoOptions.enableHighAccuracy = false;
                    navigator.geolocation.getCurrentPosition(success, lastFail, geoOptions);
                } else {
                    lastFail(err);
                }
            };

            const lastFail = (err) => {
                statusDot.className = "bg-red-500 w-2.5 h-2.5 rounded-full";
                errorHint.classList.remove('hidden');
                
                let msg = "위치 정보를 가져올 수 없습니다.";
                if (window.location.protocol !== 'https:') {
                    msg = "보안(HTTPS) 연결이 아니어서 위치 권한을 얻을 수 없습니다.";
                } else if (err.code === 1) {
                    msg = "위치 권한 사용을 허용해 주세요.";
                } else if (err.code === 3) {
                    msg = "GPS 신호 탐색 시간이 초과되었습니다. 다시 시도해 주세요.";
                }
                
                statusText.innerText = "위치 확인 오류";
                errorHint.innerText = msg;
                btn.disabled = true;
            };

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(success, fail, geoOptions);
            } else {
                statusText.innerText = "GPS 미지원 브라우저";
            }
        }

        async function getAIRecommendations(customPrompt = null) {
            if (!userLocation || !storedApiKey) return;

            const resultsContainer = document.getElementById('results-container');
            const skeleton = document.getElementById('skeleton');
            const emptyState = document.getElementById('empty-state');
            const btn = document.getElementById('get-recommendations-btn');
            const aiArea = document.getElementById('ai-interact-container');

            emptyState.classList.add('hidden');
            skeleton.classList.remove('hidden');
            if (!customPrompt) resultsContainer.innerHTML = '';
            btn.disabled = true;

            const systemPrompt = `
                당신은 전세계를 여행하는 한국인 가성비 여행 전문가입니다. 
                현재 위치(위도: ${userLocation.lat}, 경도: ${userLocation.lng}) 주변 1.5km 이내에서 가성비 좋은 ${currentCategory} 장소를 5-7곳 추천하세요.
                
                반드시 JSON 형식으로만 답변하세요:
                {
                    "recommendations": [
                        {
                            "name": "장소명",
                            "category": "종류",
                            "features": "이곳만의 특징 및 가성비 포인트 설명",
                            "estimated_cost": "예상 비용 (현지통화/원화)",
                            "korean_popular_menu": "한국인 인기 메뉴 (없으면 N/A)",
                            "distance_info": "도보 약 몇 분"
                        }
                    ]
                }
            `;

            const queryText = customPrompt || `현재 내 위치 주변에서 가성비 좋은 ${currentCategory} 장소들을 추천해 주세요.`;

            try {
                const response = await fetchWithRetry(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${storedApiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: queryText }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: { 
                                responseMimeType: "application/json",
                                responseSchema: {
                                    type: "OBJECT",
                                    properties: {
                                        recommendations: {
                                            type: "ARRAY",
                                            items: {
                                                type: "OBJECT",
                                                properties: {
                                                    name: { type: "STRING" },
                                                    category: { type: "STRING" },
                                                    features: { type: "STRING" },
                                                    estimated_cost: { type: "STRING" },
                                                    korean_popular_menu: { type: "STRING" },
                                                    distance_info: { type: "STRING" }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        })
                    }
                );

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const result = JSON.parse(data.candidates[0].content.parts[0].text);
                renderResults(result.recommendations, !!customPrompt);
                aiArea.classList.remove('hidden');
                
                if (customPrompt) {
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }

            } catch (err) {
                console.error(err);
                showError("AI 추천을 가져오지 못했습니다: " + err.message);
                if (resultsContainer.innerHTML === '') emptyState.classList.remove('hidden');
            } finally {
                skeleton.classList.add('hidden');
                btn.disabled = false;
            }
        }

        async function aiAction(type) {
            const input = document.getElementById('ai-input');
            const text = input.value.trim();
            if (!text) return;

            const promptPrefix = type === 'edit' 
                ? "이전 추천 리스트를 기반으로 다음 요청사항에 맞춰 다시 추천해줘: " 
                : "추천된 장소들에 대해 혹은 주변 환경에 대해 다음 질문에 답해줘: ";
            
            await getAIRecommendations(promptPrefix + text);
            input.value = '';
        }

        async function fetchWithRetry(url, options, retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return response;
                    if (response.status === 429) {
                        await new Promise(res => setTimeout(res, 2000));
                        continue;
                    }
                    throw new Error(`HTTP ${response.status}`);
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, 1000));
                }
            }
        }

        function renderResults(list, isAppend = false) {
            const container = document.getElementById('results-container');
            if (!isAppend) container.innerHTML = '';

            list.forEach(item => {
                const icon = item.category.includes('관광') ? '🏛️' : item.category.includes('음식') ? '🍽️' : item.category.includes('산책') ? '🌳' : '☕';
                const card = document.createElement('div');
                card.className = "bg-white rounded-[2rem] p-6 border border-gray-100 shadow-sm hover:shadow-xl transition-all duration-300 animate-in fade-in slide-in-from-bottom-5";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-2.5">
                            <span class="text-2xl">${icon}</span>
                            <span class="text-[10px] font-extrabold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg uppercase tracking-tighter">${item.category}</span>
                        </div>
                        <span class="text-[11px] text-gray-400 font-bold bg-gray-50 px-2 py-1 rounded-md">🚶 ${item.distance_info}</span>
                    </div>
                    <h3 class="text-xl font-bold mb-3 text-gray-900">${item.name}</h3>
                    <p class="text-gray-600 text-sm leading-relaxed mb-5 font-medium">${item.features}</p>
                    
                    <div class="space-y-2.5">
                        <div class="flex items-center gap-3 bg-gray-50/80 p-3.5 rounded-2xl border border-gray-100">
                            <span class="text-xs font-bold text-gray-400 shrink-0 w-14 uppercase">Cost</span>
                            <span class="text-sm text-gray-700 font-bold">${item.estimated_cost}</span>
                        </div>
                        <div class="flex items-center gap-3 bg-blue-50/50 p-3.5 rounded-2xl border border-blue-100">
                            <span class="text-xs font-bold text-blue-400 shrink-0 w-14 uppercase">Best</span>
                            <span class="text-sm text-blue-800 font-bold">${item.korean_popular_menu}</span>
                        </div>
                    </div>

                    <button onclick="window.open('https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + (userLocation ? userLocation.lat + ',' + userLocation.lng : ''))}')" 
                            class="w-full mt-6 bg-gray-900 text-white py-4 rounded-2xl text-sm font-bold active:scale-[0.96] transition-all shadow-lg shadow-gray-200">
                        지도로 길찾기
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function showError(msg) {
            document.getElementById('error-message').innerText = msg;
            document.getElementById('error-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('error-modal').classList.add('hidden');
        }
    </script>
</body>
